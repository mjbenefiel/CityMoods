name: Daily mood

on:
  schedule:
    # 05:07 UTC = 11:07 PM Central (midnight in summer). NYC refreshes the 311 data each evening around
    # 8:30-9:15 PM Central, completing the previous day. If nothing new is posted yet, the run does nothing.
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      city:
        description: "Which city: all, nyc, chicago, la, sf or boston"
        required: false
        default: "all"
      dates:
        description: "Optional: rebuild specific days with Claude's headlines, e.g. 2026-11-08 2026-11-09 (max 10). Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: write

concurrency: daily-mood

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Build the latest moods
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATES: ${{ inputs.dates }}
          CITY: ${{ inputs.city || 'all' }}
        run: |
          case "$CITY" in all|nyc|chicago|la|sf|boston) ;; *) echo "Unknown city: $CITY"; exit 1;; esac
          if [ -n "$DATES" ]; then python pipeline/build.py --city "$CITY" --dates "$DATES" --claude; else python pipeline/build.py --city "$CITY"; fi
      - name: Publish
        # Runs even if the build failed or was cancelled partway, so finished days aren't thrown away.
        if: always()
        run: |
          git config user.name "citymoods-bot"
          git config user.email "citymoods-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            DAYS=$(git diff --cached --name-only | grep -oE '[a-z]+/days/[0-9]{4}-[0-9]{2}-[0-9]{2}' | sed 's#/days/# #' | sort -u | tr '\n' ',' | sed 's/,$//; s/,/, /g')
            git commit -m "Moods for ${DAYS:-latest data}"
            # Someone may have pushed site changes while this ran; replay our data commit on top.
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
