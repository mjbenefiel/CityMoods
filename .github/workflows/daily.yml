name: Daily mood

on:
  schedule:
    # 05:07 UTC = 11:07 PM Central (midnight in summer). NYC refreshes the 311 data each evening around
    # 8:30-9:15 PM Central, completing the previous day. If nothing new is posted yet, the run does nothing.
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-mood

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Build yesterday's mood
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/build.py
      - name: Publish
        run: |
          git config user.name "citymood-bot"
          git config user.email "citymood-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Nothing new."; else git commit -m "Mood for $(python3 -c \"import json;print(json.load(open('docs/data/latest.json'))['date'])\")" && git push; fi
