name: Daily mood

on:
  schedule:
    # 05:07 UTC = 11:07 PM Central (midnight in summer). NYC refreshes the 311 data each evening around
    # 8:30-9:15 PM Central, completing the previous day. If nothing new is posted yet, the run does nothing.
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      dates:
        description: "Optional: rebuild specific days with Claude's headlines, e.g. 2026-11-08 2026-11-09 (max 10). Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: write

concurrency: daily-mood

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Build yesterday's mood
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATES: ${{ inputs.dates }}
        run: |
          if [ -n "$DATES" ]; then python pipeline/build.py --dates "$DATES" --claude; else python pipeline/build.py; fi
      - name: Publish
        # Runs even if the build failed or was cancelled partway, so finished days aren't thrown away.
        if: always()
        run: |
          git config user.name "citymood-bot"
          git config user.email "citymood-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            DAY=$(python3 -c 'import json; print(json.load(open("docs/data/latest.json"))["date"])')
            git commit -m "Mood for $DAY"
            git push
          fi
